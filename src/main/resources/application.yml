server:
  port: 7654
spring:
  application:
    name: transaction-recon-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/aegis_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aegis-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: achlaq.co.transactionreconengine.dto,achlaq.co.transactionreconengine.ledger.dto
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            add:
              type:
                headers: true
    listener:
      ack-mode: record

  data:
    redis:
      host: localhost
      port: 6379
    elasticsearch:
      repositories:
        enabled: true

  elasticsearch:
    uris: http://localhost:9200

  # Security configuration
  security:
    jwt:
      secret: ${JWT_SECRET:supersecretkeythatyoushouldneverhardcodeinproductionbutusevaultinstead1234567890}
      expiration: 86400000 # 1 day

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

logging:
  level:
    achlaq.co.transactionreconengine: INFO
    org.springframework.security: WARN
    org.elasticsearch.client.RestClient: ERROR

app:
  kafka:
    topics:
      transactions: trx-events
      transactions-dlq: trx-events-dlq
      audit-dlq: audit-events-dlq
      ledger: ledger-events
      ledger-dlq: ledger-events-dlq
  
  transaction:
    rate-limit:
      max-per-minute: 5

  risk:
    base-currency: IDR
    rules:
      - limit: 100000000
        riskLevel: HIGH
        status: FRAUD_DETECTED
        reason: High Value Transaction Exceeded
      - limit: 999999
        riskLevel: MEDIUM
        status: REVIEW_NEEDED
        reason: Suspicious Medium Value
