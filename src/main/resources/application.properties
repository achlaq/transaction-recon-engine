spring.application.name=transaction-recon-engine
server.port=7654

spring.datasource.url=jdbc:postgresql://localhost:5432/aegis_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=aegis-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=achlaq.co.transactionreconengine.dto,achlaq.co.transactionreconengine.ledger.dto

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.listener.ack-mode=record

app.kafka.topics.transactions=trx-events
app.kafka.topics.transactions-dlq=trx-events-dlq
app.kafka.topics.audit-dlq=audit-events-dlq
app.kafka.topics.ledger=ledger-events
app.kafka.topics.ledger-dlq=ledger-events-dlq

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.elasticsearch.uris=http://localhost:9200
logging.level.org.elasticsearch.client.RestClient=ERROR

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Transaction processing limits
app.transaction.rate-limit.max-per-minute=5